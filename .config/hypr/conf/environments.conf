# --- XDG Desktop Portal ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- NVIDIA / CUDA (2026 Optimized) ---
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct      # Fixes window metadata sync on new drivers
env = __GL_VR_ALLOWED,0       # Disabled for stability during setup

# --- Toolkits ---
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_SCALE,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = OZONE_PLATFORM,wayland

# --- Appearance & Misc ---
env = XCURSOR_SIZE,24
env = APPIMAGELAUNCHER_DISABLE,1

exec = gsettings set org.gnome.desktop.wm.preferences theme "Nordic"
exec = gsettings set org.gnome.desktop.interface gtk-theme "Nordic"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

xwayland {
    enabled = true
    force_zero_scaling = true
}
